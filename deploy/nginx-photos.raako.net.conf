server {
    server_name photos.raako.net;

    root /var/www/photos.raako.net;

    index index.html index.htm index.php;

    # ---------------------------------------------------------------
    # PWA critical: never cache the app entry points / service worker
    # so updates and force-reload can always reach the browser.
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Album list – short cache so new albums appear after a normal visit / force-reload
    location = /albums-manifest.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Photos – long-lived (matches PWA CacheFirst strategy)
    location ~* \.(jpg|jpeg|png|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hashed Vite build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
       try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/photos.raako.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/photos.raako.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = photos.raako.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name photos.raako.net;
    listen 80;
    return 404; # managed by Certbot
}
