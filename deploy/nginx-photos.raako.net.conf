# Nginx site config for photos.raako.net (PWA + long-lived image cache)
#
# Place this (or include it) in your sites-enabled config, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes the built Vite output is served from /var/www/photos (adjust root path).

server {
    listen 80;
    listen [::]:80;
    server_name photos.raako.net;

    # Redirect HTTP → HTTPS (recommended for PWA install + service workers)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name photos.raako.net;

    # --- TLS (adjust paths to your certs) ---
    # ssl_certificate     /etc/letsencrypt/live/photos.raako.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/photos.raako.net/privkey.pem;

    root /var/www/photos;   # ← change to your actual build output directory
    index index.html;

    # Security / performance basics
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # CRITICAL for PWA updates:
    # Never cache the entry HTML or the service worker itself.
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Workbox may emit workbox-*.js – also keep fresh
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # albums-manifest.json – short cache so force-reload can discover new albums
    location = /albums-manifest.json {
        add_header Cache-Control "public, max-age=300";  # 5 minutes
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # Photo assets – long-lived (matches the PWA CacheFirst strategy)
    # ---------------------------------------------------------------
    location /images/ {
        # 1 year + immutable (filenames are content-stable once generated)
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Hashed Vite build assets (JS/CSS with content hashes in name)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (icons, etc.)
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA fallback – all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
